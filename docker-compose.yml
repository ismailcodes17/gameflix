services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gameflix
      POSTGRES_PASSWORD: gameflix
      POSTGRES_DB: gameflix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: